<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>План на прогулку</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #121212);
      --card: var(--tg-theme-secondary-bg-color, #1e1e1e);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #9e9e9e);
      --accent: var(--tg-theme-button-color, #2ea6ff);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .progress {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 25%;
      transition: width 0.3s ease;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .subtitle { color: var(--hint); font-size: 14px; margin-bottom: 20px; }
    .step { display: none; animation: fadeIn 0.25s ease; }
    .step.active { display: block; }
    .btn {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:active { transform: scale(0.98); background: var(--accent); color: var(--accent-text); }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      text-align: center;
      font-weight: 600;
      margin-top: 8px;
    }
    .custom-box { display: none; margin-top: 10px; }
    .custom-box.visible { display: block; }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .summary-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 15px;
    }
    .summary-item span { color: var(--hint); display: block; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

    <!-- Шаг 1 -->
    <div class="step active" id="step1">
      <h1>1) Пойдешь гулять?</h1>
      <p class="subtitle">Выбери подходящий вариант</p>
      <button class="btn" onclick="answer(1, 'Да')">Да</button>
      <button class="btn" onclick="answer(1, 'Скорее всего да')">Скорее всего да</button>
      <button class="btn" onclick="answer(1, 'Скорее всего нет')">Скорее всего нет</button>
      <button class="btn" onclick="answer(1, 'Нет')">Нет</button>
    </div>

    <!-- Шаг 2 -->
    <div class="step" id="step2">
      <h1>2) Где будем гулять?</h1>
      <p class="subtitle">Выбери район или напиши свой</p>
      <button class="btn" onclick="answer(2, 'В твоем районе')">В твоем районе</button>
      <button class="btn" onclick="answer(2, 'У меня на районе')">У меня на районе</button>
      <button class="btn" onclick="toggleCustom(2)">✍️ Свой вариант</button>
      <div class="custom-box" id="custom2">
        <input type="text" id="input2" placeholder="Напиши место...">
        <button class="btn btn-primary" onclick="submitCustom(2)">Далее</button>
      </div>
    </div>

    <!-- Шаг 3 -->
    <div class="step" id="step3">
      <h1>3) Когда пойдем?</h1>
      <p class="subtitle">Выбери день или укажи удобное время</p>
      <button class="btn" onclick="answer(3, 'Суббота')">Суббота</button>
      <button class="btn" onclick="answer(3, 'Воскресенье')">Воскресенье</button>
      <button class="btn" onclick="toggleCustom(3)">✍️ Свой вариант</button>
      <div class="custom-box" id="custom3">
        <input type="text" id="input3" placeholder="Например: пятница после 19:00...">
        <button class="btn btn-primary" onclick="submitCustom(3)">Далее</button>
      </div>
    </div>

    <!-- Шаг 4 -->
    <div class="step" id="step4">
      <h1>4) Куда пойдем трапезничать?</h1>
      <p class="subtitle">Финальный штрих</p>
      <button class="btn" onclick="finish('Мак (другое ПБО)')">Мак (другое ПБО)</button>
      <button class="btn" onclick="finish('Куда-нибудь рядом')">Куда-нибудь рядом</button>
      <button class="btn" onclick="finish('Возьмем с собой')">Возьмем с собой</button>
      <button class="btn" onclick="finish('Ресторан')">Ресторан</button>
    </div>

    <!-- Финал -->
    <div class="step" id="step5">
      <h1>🎉 План успешно составлен!</h1>
      <p class="subtitle">Ответы отправлены организатору</p>
      <div id="summaryList"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const answers = {};

    function showStep(n) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById('step' + n).classList.add('active');
      document.getElementById('progressBar').style.width = (n * 25) + '%';
    }

    function answer(step, value) {
      answers['q' + step] = value;
      showStep(step + 1);
    }

    function toggleCustom(step) {
      const box = document.getElementById('custom' + step);
      box.classList.toggle('visible');
      document.getElementById('input' + step).focus();
    }

    function submitCustom(step) {
      const val = document.getElementById('input' + step).value.trim();
      if (!val) return;
      answer(step, val);
    }

    function finish(foodValue) {
      answers.q4 = foodValue;
      document.getElementById('progressBar').style.width = '100%';

      const summaryText =
        `1) Пойдешь гулять: ${answers.q1}\n` +
        `2) Где гуляем: ${answers.q2}\n` +
        `3) Когда пойдем: ${answers.q3}\n` +
        `4) Где трапезничаем: ${answers.q4}`;

      document.getElementById('summaryList').innerHTML = `
        <div class="summary-item"><span>1) Пойдешь гулять</span>${answers.q1}</div>
        <div class="summary-item"><span>2) Где гуляем</span>${answers.q2}</div>
        <div class="summary-item"><span>3) Когда пойдем</span>${answers.q3}</div>
        <div class="summary-item"><span>4) Где трапезничаем</span>${answers.q4}</div>
      `;
      showStep(5);

      // Отправляем ответы в Telegram бота (окно закроется автоматически)
      setTimeout(() => {
        tg.sendData(JSON.stringify({ summary: summaryText }));
      }, 400);
    }
  </script>
</body>
</html>
